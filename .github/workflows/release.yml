# release.yml -- the screen recorder package (package.conf: the H.264 encoder plug-in, never in an image), built by the
# pdk's package.yml on every push to main. When the
# commits since the last release ask for one (Conventional Commits: feat = minor, fix/perf = patch, breaking = major;
# the pdk's tools/ci/next_version.sh), they are released under that version; Catalogue finds them through the index.
name: release

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The pdk's release scripts
        run: |
          for f in next_version.sh commit_lint.sh; do
            curl -fsSL -o "/tmp/$f" "https://raw.githubusercontent.com/${{ github.repository_owner }}/pdk/main/tools/ci/$f"
          done
      - name: Conventional Commit subjects
        if: github.event_name == 'push'
        run: sh /tmp/commit_lint.sh "${{ github.event.before }}" "${{ github.sha }}"
      - name: Next version
        id: v
        run: |
          v=$(sh /tmp/next_version.sh)
          echo "next version: ${v:-none (nothing to release)}"
          echo "version=$v" >> "$GITHUB_OUTPUT"

  package:
    needs: version
    uses: Phorepoc/pdk/.github/workflows/package.yml@main
    permissions:
      contents: read
      packages: read

  publish:
    needs: [version, package]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package-files
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # an existing release is only topped up by a run of its own commit, never overwritten from another one
          if gh release view "$VERSION" -R "${{ github.repository }}" >/dev/null 2>&1; then
            at=$(gh api "repos/${{ github.repository }}/commits/$VERSION" -q .sha)
            [ "$at" = "${{ github.sha }}" ] || { echo "::error::$VERSION is already released from $at, not ${{ github.sha }}: nothing uploaded"; exit 1; }
          else
            gh release create "$VERSION" -R "${{ github.repository }}" --target "${{ github.sha }}" --title "$VERSION" \
              --notes-file notes.md
          fi
          gh release upload "$VERSION" out/* -R "${{ github.repository }}" --clobber
