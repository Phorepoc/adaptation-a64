# package.conf -- how the pdk's package.yml builds this repository's SIS (release.yml): the screen recorder's H.264
# encoder plug-in (src/pherecenc). H.264 is patent-encumbered, so the encoder is never in an image (the registry builds
# it device-only); the image's recorder (src/pherec) loads it once Catalogue has installed this package.
NAME=screenrec-a64
ARCHES="arm"
COMPONENTS_arm="pherecenc"
ADDON=0                                   # no add-on archive: the encoder is never added to an image
